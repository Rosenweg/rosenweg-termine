name: rosenweg_termine
description: "Rosenweg Termine – Termine und Versammlungen deiner STWEG: ansehen, in den Kalender übernehmen, erinnern lassen."
publish_to: 'none'

# version: x.y.z+Baunummer. Ein Merge auf main mit einer NEUEN Version (Tag
# vx.y.z gibt es noch nicht) baut alle Plattformen und veroeffentlicht sie
# (GitHub-Release, /apps). Unveraenderte Version = nur CI, kein Release.
version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Einstellungen als eigene Datei (auch fuer die Abfrage im Hintergrund)
  path_provider: ^2.1.5
  # "Nextcloud-Kalender oeffnen"
  url_launcher: ^6.3.3
  # Gemeinsame Basis der Rosenweg-Apps: Anmeldung (Karte, QR, Konto, still per
  # Kerberos), API, Gerüst (Handy/Desktop), Updater, Logo-Baukasten.
  # Oeffentliches Repo: pub holt es ohne Token; lokal mit ../rosenweg-basis
  # ueber pubspec_overrides.yaml (siehe README, "Entwickeln").
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      ref: v0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Logo fuer Anmeldeschirm, "Über" und Titelleiste (assets/logo/erzeugen.sh)
  assets:
    - assets/logo/rosenweg-termine-512.png
    - assets/logo/rosenweg-termine-klein.png
    # Farben nach der Person (FarbLogo): Ausschuss/Verwaltung, Technik/Praesident
    - assets/logo/rosenweg-termine-verwaltung-512.png
    - assets/logo/rosenweg-termine-verwaltung-klein.png
    - assets/logo/rosenweg-termine-technik-512.png
    - assets/logo/rosenweg-termine-technik-klein.png
